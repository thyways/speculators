project:
  title: "Infinity-Parser2 DFlash acceleration"
  question: "Can a bidirectional DFlash draft trained on target-model-regenerated Infinity-Parser2 responses accelerate Infinity-Parser2-2B-2604 while preserving the verifier distribution?"
  status: active
  current_phase: "Strict 100-record / 10-step smoke passed; prepare the nested 800k pilot"
  started: "2026-08-05"
  domain: "multimodal speculative decoding"

literature:
  key_papers: []
  open_problems:
    - "Reliable multimodal target-response regeneration and token alignment at 800k-1.5M scale"
    - "Stable online hidden-state DFlash training for a Qwen3.5 VLM verifier"
  evidence_gaps:
    - "No verified 800k regeneration/preprocessing/training run yet"
    - "No Parser2 DFlash acceptance-length or throughput baseline yet"

hypotheses:
  - id: H1
    statement: "A deterministic nested 800k/1.5M sample can be regenerated by Infinity-Parser2-2B-2604, filtered during verifier preprocessing, and published in exactly the DFlash Arrow format without prompt/media drift."
    status: active
    motivation: "DFlash quality and online hidden-state alignment require responses and tokenization from the exact target model."
    parent: null
    priority: high
  - id: H2
    statement: "A Qwen3 draft using bidirectional block attention, AdamW, and cosine decay can complete a strict multimodal smoke training run with finite loss and exact verifier token alignment."
    status: supported_at_smoke
    motivation: "This is the requested training recipe and the minimum evidence that the full 800k run is viable."
    parent: null
    priority: high
  - id: H3
    statement: "Extending the nested pool from 800k to 1.5M improves final DFlash acceptance length and/or throughput without reducing output equivalence."
    status: pending
    motivation: "The user selected 1.5M as the final large-scale validation regime."
    parent: null
    priority: medium

experiments:
  proxy_metric: "Exact validated record count plus a 10-step strict smoke run with finite loss, zero token-ID mismatches, zero hidden-state failures, and a saved checkpoint"
  baseline_value: null
  best_value: 3.809215
  total_runs: 2
  trajectory:
    - id: smoke_100_attempt_1
      hypothesis: H2
      classification: exploratory_infrastructure_failure
      status: invalid
      metric: "optimizer steps before termination"
      value: 15
      target: 10
      summary: "Trainer enforced max_steps only inside each epoch, so later epochs each performed one extra update; archived and excluded."
    - id: smoke_100_attempt_2
      hypothesis: H2
      classification: confirmatory
      status: passed
      metric: "validation loss after exactly 10 optimizer steps"
      value: 3.809215
      wall_time_min: 12.22
      summary: "Exact multimodal token round-trip; finite losses on steps 0-9; AdamW + cosine + bidirectional SWA; checkpoint_best=4."

outer_loop:
  cycle: 1
  last_direction: "DEEPEN: scale the verified pipeline to the deterministic nested 800k pilot"
  last_reflection: "The requested Parser2 DFlash recipe is operational at smoke scale. The next uncertainty is scale, not basic token/hidden-state alignment."

